<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Stack · Hamza</title>
  <meta name="description" content="A one-button stacking game. Drop each block on the last one and see how high you can go.">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/InterTight.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: radial-gradient(120% 90% at 50% 110%, hsl(var(--hue, 30) 30% 22%), var(--bg) 60%); transition: background 1.2s; }
    .score { top: 96px; }
    .score__n { font-size: clamp(5rem, 16vw, 11rem); line-height: 0.8; font-weight: 300; letter-spacing: -0.06em; font-variant-numeric: tabular-nums; transition: transform 0.5s var(--ease); }
    .score__n.bump { transform: scale(1.12); }
    .score__best { color: var(--muted); }
    .perfect { font-family: var(--serif); font-style: italic; font-size: clamp(1.6rem, 3vw, 2.4rem); color: var(--accent); opacity: 0; transform: translateY(8px); transition: opacity 0.3s, transform 0.5s var(--ease); }
    .perfect.show { opacity: 1; transform: none; }
    .prompt { bottom: calc(40px + env(safe-area-inset-bottom)); }
    .prompt__title { font-size: clamp(2.4rem, 7vw, 5rem); font-weight: 500; letter-spacing: -0.05em; line-height: 0.95; }
    .prompt__title em { color: var(--accent); }
    .prompt__hint { padding: 10px 18px; }
    .prompt { transition: opacity 0.5s var(--ease), transform 0.7s var(--ease); }
    .is-playing .prompt { opacity: 0; transform: translateY(20px); }
    .tools { position: fixed; right: var(--pad); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 30; display: flex; gap: 4px; padding: 4px; }
  </style>
</head>
<body class="app" data-page="play">
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span class="cursor__label">View</span></div>

  <header class="nav">
    <a class="nav__brand" href="/" data-magnetic>Hamza<sup>©</sup></a>
    <span class="nav__time mono">Stack</span>
    <nav class="nav__links" aria-label="Primary">
      <a href="/#work">Work</a>
      <a href="/play" aria-current="page">Play</a>
      <a href="/draw">Draw</a>
      <a href="/#contact">Contact</a>
    </nav>
  </header>

  <canvas class="app-canvas" id="game" aria-label="Stack game. Press space or tap to drop a block."></canvas>

  <div class="hud score">
    <span class="score__n" id="score">0</span>
    <span class="score__best mono">Best <span id="best">0</span></span>
    <span class="perfect" id="perfect">Perfect</span>
  </div>

  <div class="hud prompt" id="prompt">
    <h1 class="prompt__title" id="prompt-title">Stack</h1>
    <span class="prompt__hint glass mono" id="prompt-hint">Tap, click or press space</span>
  </div>

  <div class="tools glass">
    <button class="icon-btn" id="sound" aria-pressed="true" title="Sound">Sound</button>
  </div>

  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
  <script src="/main.js" defer></script>
  <script type="module" src="/play.js"></script>
</body>
</html>
