<!doctype html>
<html lang="en-GB">
<head>

  <meta name="theme-color" content="#3c4143">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Addresses from earlier versions of the site open the matching dashboard screen.
    (function () {
      var k = location.pathname.replace(/\.html$/, '').replace(/\/$/, '').slice(1).toLowerCase();
      var to = { about: 'profile', work: 'games', projects: 'games', stats: 'profile', finder: 'games', settings: 'settings', achievements: 'achievements' }[k];
      var home = ['guestbook', 'draw', 'terminal', 'arcade', 'play', 'type', 'wyr', 'review', 'index', 'doom'].indexOf(k) >= 0;
      if (to || home) location.replace(to ? '/#' + to : '/');
    })();
  </script>
  <style>
    @font-face { font-family: Selawik; font-weight: 300; src: url(/assets/fonts/selawkl.woff2) format("woff2"); }
    @font-face { font-family: Selawik; font-weight: 400; src: url(/assets/fonts/selawk.woff2) format("woff2"); }
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: linear-gradient(#3c4143 0%, #666b6d 42%, #c7c9c8 100%) fixed; color: #fff; font: 400 16px/1.33 "Segoe UI", Selawik, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(560px, calc(100% - 32px)); }
    h1 { margin: 0 0 6px; font-size: 44px; font-weight: 300; }
    p { margin: 0 0 28px; font-size: 19px; font-weight: 300; color: rgba(255, 255, 255, .85); }
    a { display: inline-flex; align-items: center; gap: 8px; padding: 14px 22px; background: linear-gradient(to bottom right, #1ea91e 0%, #0c970c 28%, #028d02 58%, #007d00 100%); color: #fff; font-size: 20px; text-decoration: none; transition: transform .16s cubic-bezier(.215, .61, .355, 1); }
    a:hover, a:focus-visible { transform: scale(1.07); box-shadow: 6.4px 6.4px 18px rgba(0, 0, 0, .34); outline: none; }
    i { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: #6cb344; font: 700 12px/1 "Segoe UI", Selawik, sans-serif; font-style: normal; box-shadow: 0 0 0 1px rgba(255, 255, 255, .4); }
  </style>
</head>
