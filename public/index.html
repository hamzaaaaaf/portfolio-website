        <button class="tile tile--set" type="button" data-set="live"><span class="tile__art"><svg><use href="#i-people"/></svg></span><span class="tile__label">Online presence: <b data-setval="live"></b></span></button>
        <button class="tile tile--sys" type="button" data-open="system"><span class="tile__art"><svg><use href="#i-info"/></svg></span><span class="tile__label">System info</span></button>
        <button class="tile tile--off" type="button" data-poweroff><span class="tile__art"><svg><use href="#i-power"/></svg></span><span class="tile__label">Turn off console</span></button>
      </div>
    </section>
  </main>

  <p class="hints" aria-hidden="true"><span><i class="btn btn--a">A</i> select</span><span><i class="btn btn--b">B</i> back</span><span><i class="btn btn--lb">LB</i><i class="btn btn--lb">RB</i> tabs</span><span><i class="btn btn--x">⊗</i> guide</span></p>

  <div class="app" hidden>
    <div class="app__bar">
      <button class="app__back" type="button" data-back aria-label="Back"><i class="btn btn--b">B</i><span>back</span></button>
      <h1 class="app__title"></h1>
      <span class="gs"><i>G</i><span data-gs>0</span></span>
    </div>
    <div class="app__body">
      <div class="app__load" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

  <div class="guide" hidden>
    <div class="guide__panel" role="dialog" aria-label="Guide">
      <div class="guide__head">
        <span class="pic" aria-hidden="true"><i>h</i></span>
        <span><b>Hamza</b><span class="gs"><i>G</i><span data-gs>0</span></span></span>
      </div>
      <div class="guide__list">
        <button type="button" data-go="home">Dashboard home</button>
        <button type="button" data-open="achievements">Achievements</button>
        <button type="button" data-go="projects">Projects</button>
        <button type="button" data-go="games">Games</button>
        <button type="button" data-open="arcade">Arcade</button>
        <button type="button" data-go="social">Social</button>
        <button type="button" data-go="settings">System settings</button>
        <button type="button" data-poweroff>Turn off console</button>
      </div>
      <div class="guide__foot"><time data-clock></time><span><i class="btn btn--b">B</i> back</span></div>
    </div>
  </div>

  <div class="toaster" aria-live="polite"></div>

  <script src="/os.js" defer></script>
  <script src="/x360.js" defer></script>
</body>
