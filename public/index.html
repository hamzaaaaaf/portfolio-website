        <button class="tile tile--img art-ie" type="button" data-open="ie" style="--a:1/2/3/4"><span class="art"><svg><use href="#i-ie"/></svg></span><span class="tile__label">Internet Explorer</span></button>
        <button class="tile tile--img art-guestbook2" type="button" data-open="guestbook" style="--a:3/2/4/3"><svg class="tile__ico"><use href="#i-book"/></svg><span class="tile__label">Guestbook</span></button>
        <button class="tile tile--img art-type" type="button" data-open="type" style="--a:3/3/4/4"><span class="art"><svg class="tile__ico"><use href="#i-keys"/></svg></span><span class="tile__label">Typing Test</span></button>
        <button class="tile tile--img art-wyr art-wyr--icon" type="button" data-open="wyr" style="--a:1/4/2/5"><svg class="tile__ico"><use href="#i-vs"/></svg><span class="tile__label">Would You Rather</span></button>
        <button class="tile tile--img art-arcade" type="button" data-open="arcade" style="--a:2/4/3/5"><span class="art"><i></i><i></i><i></i><i></i><i></i><b></b></span><span class="tile__label">Arcade</span></button>
        <button class="tile tile--sys" type="button" data-open="system" style="--a:3/4/4/5"><svg class="tile__ico"><use href="#i-info"/></svg><span class="tile__label">System Info</span></button>
      </div>
    </section>
    <section class="pane" data-pane="settings" aria-label="settings">
      <div class="tiles">
        <button class="tile tile--sys" type="button" data-open="achievements" style="--a:1/1/2/2"><svg class="tile__ico"><use href="#i-user"/></svg><span class="tile__label">Profile</span></button>
        <button class="tile tile--sys" type="button" data-open="system" style="--a:2/1/3/2"><svg class="tile__ico"><use href="#i-info"/></svg><span class="tile__label">System</span></button>
        <button class="tile tile--sys" type="button" data-poweroff style="--a:3/1/4/2"><svg class="tile__ico"><use href="#i-power"/></svg><span class="tile__label">Turn Off</span></button>
        <button class="tile tile--sys" type="button" data-set="theme" style="--a:1/2/2/3"><svg class="tile__ico"><use href="#i-moon"/></svg><span class="tile__label">Theme: <b data-setval="theme"></b></span></button>
        <button class="tile tile--sys" type="button" data-set="skin" style="--a:2/2/3/3"><svg class="tile__ico"><use href="#i-palette"/></svg><span class="tile__label">Colour: <b data-setval="skin"></b></span></button>
        <button class="tile tile--sys" type="button" data-set="sound" style="--a:3/2/4/3"><svg class="tile__ico"><use href="#i-sound"/></svg><span class="tile__label">Sound: <b data-setval="sound"></b></span></button>
        <button class="tile tile--sys" type="button" data-set="motion" style="--a:1/3/2/4"><svg class="tile__ico"><use href="#i-motion"/></svg><span class="tile__label">Motion: <b data-setval="motion"></b></span></button>
        <button class="tile tile--sys" type="button" data-set="live" style="--a:2/3/3/4"><svg class="tile__ico"><use href="#i-people"/></svg><span class="tile__label">Online: <b data-setval="live"></b></span></button>
        <button class="tile tile--sys" type="button" data-open="achievements" style="--a:3/3/4/4"><svg class="tile__ico"><use href="#i-trophy"/></svg><span class="tile__label">Achievements</span></button>
      </div>
    </section>
  </main>

  <p class="hints" aria-hidden="true"><span><i class="btn btn--a">A</i> Select</span><span><i class="btn btn--b">B</i> Back</span><span><i class="btn btn--y">Y</i> Search</span><span><i class="btn btn--x">X</i> Guide</span></p>

  <div class="app" hidden>
    <div class="app__bar">
      <button class="app__back" type="button" data-back aria-label="Back"><i class="btn btn--b">B</i><span>back</span></button>
      <h1 class="app__title"></h1>
      <span class="gs"><i>G</i><span data-gs>0</span></span>
    </div>
    <div class="app__body">
      <div class="app__load" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

  <div class="guide" hidden>
    <div class="guide__panel" role="dialog" aria-label="Guide">
      <div class="guide__head">
        <span class="pic" aria-hidden="true"><i>h</i></span>
        <span><b>Hamza</b><span class="gs"><i>G</i><span data-gs>0</span></span></span>
      </div>
      <div class="guide__list">
        <button type="button" data-go="home">Dashboard home</button>
        <button type="button" data-open="achievements">Achievements</button>
        <button type="button" data-go="projects">Projects</button>
        <button type="button" data-go="games">Games</button>
        <button type="button" data-open="arcade">Arcade</button>
        <button type="button" data-go="social">Social</button>
        <button type="button" data-go="settings">System settings</button>
        <button type="button" data-poweroff>Turn off console</button>
      </div>
      <div class="guide__foot"><time data-clock></time><span><i class="btn btn--b">B</i> back</span></div>
    </div>
  </div>

  <div class="toaster" aria-live="polite"></div>

  <script src="/os.js" defer></script>
  <script src="/x360.js" defer></script>
</body>
</html>
