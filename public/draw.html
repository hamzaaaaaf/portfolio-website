<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kaleidoscope · Hamza</title>
  <meta name="description" content="Draw anything and it gets mirrored into a pattern. Save it when you're done.">
  <meta name="theme-color" content="#ffe066">
  <meta property="og:title" content="Kaleidoscope · Hamza">
  <meta property="og:description" content="Draw anything and it gets mirrored into a pattern. Save it when you're done.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/InterTight.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/InstrumentSerif-Italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var d=document.documentElement;d.dataset.theme=t;d.classList.add('js')})();</script>
  <style>
    .canvas-dark { --fg: #f8f1d8; --fg-rgb: 248, 241, 216; --muted: #a89f80; --line: rgba(248, 241, 216, 0.1); --bg: #15130c;
      --glass: rgba(36, 32, 22, 0.62); --glass-line: rgba(255, 255, 255, 0.08); --em: #ffd84d; background: #14120c; color: var(--fg); }
    #paper { cursor: crosshair; }
    .hint { top: 50%; translate: -50% -50%; transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); }
    .hint h1 { font-size: clamp(2.4rem, 7vw, 5.4rem); font-weight: 500; letter-spacing: -0.05em; line-height: 0.95; }
    .hint p { color: var(--muted); }
    .has-drawn .hint { opacity: 0; transform: scale(0.96); }
    .bar {
      position: absolute; left: 50%; translate: -50% 0; bottom: 14px; z-index: 3;
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px;
      padding: 6px; width: max-content; max-width: calc(100% - 24px); border-radius: 20px;
    }
    .bar__group { display: flex; align-items: center; gap: 2px; padding: 0 3px; }
    .bar__sep { width: 1px; height: 22px; background: var(--line); }
    .swatch { width: 24px; height: 24px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); transition: transform 0.4s var(--spring), box-shadow 0.3s; }
    .swatch[aria-pressed="true"] { transform: scale(1.12); box-shadow: 0 0 0 2px #14120c, 0 0 0 3.5px var(--fg); }
    .swatch--rainbow { background: conic-gradient(#ff7aa2, #ffd84d, #7fd6b2, #8fb8ff, #c79bff, #ff7aa2); }
    .size { width: 80px; accent-color: #ffd84d; }
    @media (max-width: 700px) { .bar__sep { display: none; } .size { width: 60px; } .bar .icon-btn { min-width: 30px; height: 30px; padding: 0 8px; } }
  </style>
</head>
<body class="app" data-page="draw">
  <div class="wallpaper" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span class="cursor__label">View</span></div>
  <div class="toast" role="status" aria-live="polite"><svg class="toast__icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#ffd84d"/><text x="16" y="22.5" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="21" fill="#2b2100">h</text></svg><span class="toast__text"></span></div>
  <header class="menubar">
    <div class="menubar__left">
      <a class="menubar__logo" href="/" aria-label="Home"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="currentColor"/><text x="16" y="22.5" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="21" fill="var(--bg)">h</text></svg></a>
      <a class="menubar__name" href="/">Hamza</a>
      <a class="menubar__item" href="/#work">Work</a>
      <a class="menubar__item" href="/#leetcode">LeetCode</a>
      <a class="menubar__item" href="/play">Play</a>
      <a class="menubar__item" href="/draw" aria-current="page">Draw</a>
      <a class="menubar__item" href="/#contact">Contact</a>
    </div>
    <div class="menubar__right">
      <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode" title="Light / dark"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg></button>
      <span class="menubar__clock" data-menuclock><span class="menubar__date"></span><span></span></span>
    </div>
  </header>

  <main class="win app-win">
    <div class="win__bar"><span class="lights"><button class="light light--r" type="button" aria-label="Close"><svg viewBox="0 0 8 8"><path d="M1.5 1.5l5 5M6.5 1.5l-5 5" stroke="#4d0000" stroke-width="1.3"/></svg></button><button class="light light--y" type="button" aria-label="Minimise"><svg viewBox="0 0 8 8"><path d="M1 4h6" stroke="#5c3b00" stroke-width="1.3"/></svg></button><button class="light light--g" type="button" aria-label="Zoom"><svg viewBox="0 0 8 8"><path d="M4 1v6M1 4h6" stroke="#004d0a" stroke-width="1.3"/></svg></button></span><span class="win__title">Kaleidoscope</span></div>
    <div class="win__body canvas-dark">
      <canvas class="app-canvas" id="guides" aria-hidden="true"></canvas>
      <canvas class="app-canvas" id="paper" aria-label="Drawing canvas"></canvas>
      <div class="hud hint">
        <h1>Draw <em>anything.</em></h1>
        <p>It gets mirrored into a pattern as you go.</p>
      </div>
      <div class="bar glass" role="toolbar" aria-label="Drawing tools">
        <div class="bar__group" data-group="sym" aria-label="Symmetry">
          <button class="icon-btn" type="button" data-sym="1">1</button>
          <button class="icon-btn" type="button" data-sym="4">4</button>
          <button class="icon-btn" type="button" data-sym="6">6</button>
          <button class="icon-btn" type="button" data-sym="8" aria-pressed="true">8</button>
          <button class="icon-btn" type="button" data-sym="12">12</button>
          <button class="icon-btn" type="button" id="mirror" aria-pressed="true" title="Mirror each slice">Mirror</button>
        </div>
        <span class="bar__sep"></span>
        <div class="bar__group" data-group="brush" aria-label="Brush">
          <button class="icon-btn" type="button" data-brush="ink" aria-pressed="true">Ink</button>
          <button class="icon-btn" type="button" data-brush="glow">Glow</button>
        </div>
        <span class="bar__sep"></span>
        <div class="bar__group" data-group="color" aria-label="Colour">
          <button class="swatch" type="button" data-color="#fff6d6" style="--c:#fff6d6" aria-label="Cream"></button><button class="swatch" type="button" data-color="#ffd84d" style="--c:#ffd84d" aria-label="Butter" aria-pressed="true"></button><button class="swatch" type="button" data-color="#ff8a5c" style="--c:#ff8a5c" aria-label="Tangerine"></button><button class="swatch" type="button" data-color="#ff7aa2" style="--c:#ff7aa2" aria-label="Pink"></button><button class="swatch" type="button" data-color="#7fd6b2" style="--c:#7fd6b2" aria-label="Mint"></button><button class="swatch" type="button" data-color="#8fb8ff" style="--c:#8fb8ff" aria-label="Sky"></button>
          <button class="swatch swatch--rainbow" type="button" data-color="rainbow" aria-label="Rainbow"></button>
        </div>
        <span class="bar__sep"></span>
        <div class="bar__group"><input class="size" id="size" type="range" min="1" max="24" value="5" aria-label="Brush size"></div>
        <span class="bar__sep"></span>
        <div class="bar__group">
          <button class="icon-btn" type="button" id="undo" title="Undo (Ctrl+Z)">Undo</button>
          <button class="icon-btn" type="button" id="clear">Clear</button>
          <button class="icon-btn" type="button" id="save">Save</button>
        </div>
      </div>
    </div>
  </main>

    <a class="dock__item " href="/#work" aria-label="Projects"><span class="dock__icon"><svg viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="g-work" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#3d97f2"/></linearGradient></defs><rect width="56" height="56" rx="13" fill="url(#g-work)"/><path d="M11 19a3 3 0 0 1 3-3h9l3 3h16a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H14a3 3 0 0 1-3-3Z" fill="#fff" fill-opacity=".92"/><path d="M11 24h34" stroke="#4aa3f5" stroke-opacity=".35" stroke-width="2"/></svg></span><span class="dock__tip">Projects</span></a>
    <a class="dock__item " href="/#leetcode" aria-label="LeetCode"><span class="dock__icon"><svg viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="g-lc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34322c"/><stop offset="1" stop-color="#16150f"/></linearGradient></defs><rect width="56" height="56" rx="13" fill="url(#g-lc)"/><text x="28" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#ffa116">{ }</text></svg></span><span class="dock__tip">LeetCode</span></a>
    <a class="dock__item " href="/play" aria-label="Stack"><span class="dock__icon"><svg viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="g-stack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset="1" stop-color="#ffcf3a"/></linearGradient></defs><rect width="56" height="56" rx="13" fill="url(#g-stack)"/><rect x="15" y="34" width="26" height="7" rx="2" fill="#ff8a5c"/><rect x="17" y="26" width="23" height="7" rx="2" fill="#ffb347"/><rect x="19" y="18" width="19" height="7" rx="2" fill="#fff"/></svg></span><span class="dock__tip">Stack</span></a>
    <a class="dock__item " href="/draw" aria-current="page" aria-label="Kaleidoscope"><span class="dock__icon"><svg viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="g-draw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2619"/><stop offset="1" stop-color="#100f0a"/></linearGradient></defs><rect width="56" height="56" rx="13" fill="url(#g-draw)"/><g transform="translate(28 28)" style="mix-blend-mode:screen"><ellipse rx="12" ry="4.6" cx="10" transform="rotate(0)" fill="#ffe066" fill-opacity=".85"/><ellipse rx="12" ry="4.6" cx="10" transform="rotate(60)" fill="#ff8a5c" fill-opacity=".85"/><ellipse rx="12" ry="4.6" cx="10" transform="rotate(120)" fill="#ff7aa2" fill-opacity=".85"/><ellipse rx="12" ry="4.6" cx="10" transform="rotate(180)" fill="#ffe066" fill-opacity=".85"/><ellipse rx="12" ry="4.6" cx="10" transform="rotate(240)" fill="#ff8a5c" fill-opacity=".85"/><ellipse rx="12" ry="4.6" cx="10" transform="rotate(300)" fill="#ff7aa2" fill-opacity=".85"/></g></svg></span><span class="dock__tip">Kaleidoscope</span></a>
    <a class="dock__item " href="/#contact" aria-label="Mail"><span class="dock__icon"><svg viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="g-mail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#1f7cf2"/></linearGradient></defs><rect width="56" height="56" rx="13" fill="url(#g-mail)"/><rect x="12" y="17" width="32" height="22" rx="3" fill="#fff"/><path d="m13 19 15 11 15-11" fill="none" stroke="#3d97f2" stroke-width="2.4" stroke-linejoin="round"/></svg></span><span class="dock__tip">Mail</span></a>
